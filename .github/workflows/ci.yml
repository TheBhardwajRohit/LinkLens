name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  sandbox:
    name: Sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sandbox/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  stack:
    name: Full stack (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start all services
        run: docker compose up --build -d --wait
      - name: API health check passes
        run: |
          curl -fsS http://localhost:8000/health | tee health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok', h"
      - name: Web page is served
        run: curl -fsS http://localhost:3000 | grep -q "<title>LinkLens</title>"
      - name: Sandbox cannot reach the database
        run: |
          if docker compose exec -T sandbox python -c "import socket; socket.create_connection(('db', 5432), timeout=3)"; then
            echo "Sandbox reached the database. This must never happen." && exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
