name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  sandbox:
    name: Sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
      # Tests run inside the sandbox image, against the same Chromium that real scans use,
      # with networking turned off so they can't reach the internet.
      - run: docker build --target test -t linklens-sandbox-test .
      - run: docker run --rm --network none linklens-sandbox-test

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  stack:
    name: Full stack (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start all services
        run: docker compose up --build -d --wait
      - name: API health check passes
        run: |
          curl -fsS http://localhost:8000/health | tee health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok', h"
      - name: Web page is served
        run: curl -fsS http://localhost:3000 | grep -q "<title>LinkLens</title>"
      - name: Sandbox cannot reach the database
        run: |
          if docker compose exec -T sandbox python -c "import socket; socket.create_connection(('db', 5432), timeout=3)"; then
            echo "Sandbox reached the database. This must never happen." && exit 1
          fi
      # example.com is a reserved, always-safe example domain.
      - name: A real scan of a safe page works
        run: |
          curl -fsS -X POST http://localhost:8000/scan -H "Content-Type: application/json" \
            -d '{"url": "https://example.com"}' -o scan.json
          python3 -c "
          import json
          v = json.load(open('scan.json'))['visit']
          assert v['stopped'] is None, v['notes']
          assert v['title'] == 'Example Domain', v['title']
          assert v['screenshot_jpeg_b64'], 'no screenshot'
          assert 'html' not in v, 'captured HTML must never leave the API'
          r = json.load(open('scan.json'))['recon']
          assert r['registered_domain'] == 'example.com', r
          assert r['registration']['status'] == 'ok' and r['registration']['registrar'], r['registration']
          assert r['dns']['a'], r['dns']
          assert r['certificate']['trusted'] is True, r['certificate']
          # CI has no MaxMind key: location must say so plainly instead of failing.
          assert r['server']['status'] in ('ok', 'not_configured'), r['server']
          a = json.load(open('scan.json'))['analysis']
          assert a['verdict'] == 'safe', a
          assert json.load(open('scan.json'))['saved'] is True, 'scan was not saved'
          "
      - name: Live progress streams every step and the result reopens from the database
        run: |
          id=$(curl -fsS -X POST http://localhost:8000/scans -H "Content-Type: application/json" \
            -d '{"url": "https://example.com/?email=someone@example.com"}' | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          curl -fsS -N -m 120 "http://localhost:8000/scans/$id/events" -o events.txt
          python3 -c "
          import json
          lines = open('events.txt').read().splitlines()
          kinds = [l[7:] for l in lines if l.startswith('event: ')]
          assert kinds.count('step') == 8 and kinds[-1] == 'done', kinds
          "
          curl -fsS "http://localhost:8000/scans/$id" -o saved.json
          python3 -c "
          import json
          s = json.load(open('saved.json'))
          assert s['analysis']['verdict'] == 'safe', s['analysis']
          assert 'someone@example.com' not in json.dumps(s), 'personal data must be removed from saved scans'
          "
      # localtest.me is a public test name whose DNS answer is 127.0.0.1.
      - name: A public name that points at this machine is blocked
        run: |
          curl -fsS -X POST http://localhost:8000/scan -H "Content-Type: application/json" \
            -d '{"url": "http://localtest.me"}' -o blocked.json
          python3 -c "
          import json
          v = json.load(open('blocked.json'))['visit']
          assert v['stopped'] == 'blocked', v
          assert json.load(open('blocked.json'))['analysis']['verdict'] != 'safe'
          "
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
