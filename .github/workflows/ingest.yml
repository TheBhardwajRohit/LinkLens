name: Feed ingestion

# Takes fresh links from free scam feeds, opens each in the sandbox, and stores fingerprints.
# Three jobs, so the one that touches live scam pages has no secrets and no token permissions
# (safety rule 2). Raw pages never leave the "visit" job; only fingerprints are passed on.
#
# The hourly schedule is skipped until the repository variable INGEST_ENABLED is set to "true"
# (do that once the DATABASE_URL secret exists, since without a database there is nowhere to
# store pages). A manual run can use "dry run" to try the whole chain without a database.

on:
  schedule:
    # An odd minute: GitHub delays or drops jobs scheduled at the top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: How many links to visit (1 to 40)
        default: "10"
      dry_run:
        description: Run without a database and only print what would be stored
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: feed-ingestion
  cancel-in-progress: false

env:
  PYTHONPATH: api:.

jobs:
  plan:
    name: Pick new links
    if: github.event_name == 'workflow_dispatch' || vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FEEDS: ${{ vars.FEEDS }}
      MAX: ${{ inputs.max || '20' }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - id: plan
        run: |
          python -m jobs.ingest plan --out urls.json --max "$MAX" $DRY_RUN
          echo "count=$(python -c 'import json; print(len(json.load(open("urls.json"))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: planned-links
          path: urls.json
          retention-days: 1

  visit:
    name: Visit in the sandbox (no secrets)
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # No token permissions and no secrets: nothing here is worth stealing if a page misbehaves.
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: planned-links
      - name: Start the sandbox with the same limits as docker-compose.yml
        run: |
          docker build --target runtime -t linklens-sandbox ./sandbox
          docker run -d --name sandbox -p 127.0.0.1:8100:8100 \
            --read-only --tmpfs /tmp:size=512m --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 2g --cpus 2 --pids-limit 1024 \
            linklens-sandbox
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8100/health && break
            sleep 2
          done
      - run: python -m jobs.ingest visit --in urls.json --out pages.jsonl --sandbox http://localhost:8100
      - uses: actions/upload-artifact@v7
        with:
          name: page-fingerprints
          path: pages.jsonl
          retention-days: 1
      - name: Sandbox logs
        if: always()
        run: docker logs --tail 40 sandbox || true

  store:
    name: Look up owners and store
    needs: [plan, visit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
      MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      GEOIP_DIR: ${{ github.workspace }}/.geoip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: page-fingerprints
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # The MaxMind files are downloaded once a week and reused, to stay inside their download limit.
      - uses: actions/cache@v6
        with:
          path: .geoip
          key: geoip-${{ steps.week.outputs.week }}
      - run: python -m jobs.ingest store --in pages.jsonl
