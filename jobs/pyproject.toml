[project]
name = "linklens-jobs"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../api"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["..", "../api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "jobs"]

[tool.ruff.lint.per-file-ignores]
# train.py is mostly the report's text; wrapping those lines would make them harder to read.
"train.py" = ["E501"]
